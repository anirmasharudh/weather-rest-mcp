# Activated with SPRING_PROFILES_ACTIVE=eks. Hostnames are Kubernetes Service
# DNS names (namespace-qualified), reachable via the EKS cluster's CoreDNS.
spring.datasource.url=${DB_URL}
# RDS Oracle / on-prem Oracle over Direct Connect/VPN — set via Secret
spring.data.redis.host=elasticache-payment.xxxxxx.use1.cache.amazonaws.com
# placeholder, see eks/README.md

eureka.client.service-url.defaultZone=http://eureka-server.bank-app.svc.cluster.local:8761/eureka

opa.url=http://opa.bank-app.svc.cluster.local:8181

jwt.jwk-set-uri=${JWT_JWK_SET_URI}
# e.g. Cognito user pool JWKS URI, set via Secret/ConfigMap